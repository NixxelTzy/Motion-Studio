<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keamanan Utama - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .container { text-align: center; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; width: 90%; max-width: 600px; }
        h1 { margin-bottom: 10px; color: #38bdf8; font-size: 28px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .btn-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; transition: all 0.3s ease; display: flex; align-items: center; gap: 10px; width: 220px; justify-content: center; }
        .btn-admin { background: #ef4444; color: white; border: 1px solid #b91c1c; }
        .btn-admin:hover { background: #dc2626; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); transform: translateY(-2px); }
        .btn-web { background: #10b981; color: white; border: 1px solid #059669; }
        .btn-web:hover { background: #059669; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
        .status-badge { margin-top: 30px; display: inline-block; padding: 8px 16px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 20px; font-size: 14px; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Control Center</h1>
        <p>Sistem Proteksi Lanjutan & Manajemen Web</p>
        <div class="btn-container">
            <a href="/admin" class="btn btn-admin">Admin Panel</a>
            <a href="/web" class="btn btn-web">Buka Aplikasi Web</a>
        </div>
        <div class="status-badge">Sistem Proteksi WAF Aktif</div>
    </div>
</body>
</html>
