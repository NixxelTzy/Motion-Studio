<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Application View</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f0f2f5; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); color: white; padding: 12px 18px; border-radius: 50%; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: background 0.3s; backdrop-filter: blur(5px); }
        .back-btn:hover { background: rgba(0, 0, 0, 0.9); transform: scale(1.05); }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: sans-serif; font-size: 18px; color: #555; }
    </style>
</head>
<body>
    <a href="/" class="back-btn" title="Kembali ke Dashboard">X</a>
    <div id="loader">Menghubungkan ke server aman...</div>
    <iframe id="main-frame" allow="fullscreen"></iframe>
    <script>
        fetch('/api/get-target-url')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if(data.url) {
                    const f=document.getElementById('main-frame');
f.src=data.url;
f.onerror=()=>location.href=data.url;
setTimeout(()=>{try{if(f.contentWindow&&f.contentWindow.location.href==='about:blank'){location.href=data.url}}catch(e){/*cross-origin; likely blocked*/}},1500);
                } else {
                    document.getElementById('loader').innerText = "Gagal memuat konfigurasi URL.";
                    document.getElementById('loader').style.display = 'block';
                }
            })
            .catch(err => {
                document.getElementById('loader').innerText = "Koneksi ke backend terputus.";
            });
    </script>
</body>
</html>
